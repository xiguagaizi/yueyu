<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>粤语纠音台 · cantonese.ai 发音评分</title>
    <link rel="stylesheet" href="./vendor/flatpickr/flatpickr.min.css" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">粤</span>
        <div>
          <h1>粤语纠音台</h1>
          <p class="sub">小打卡课文 · cantonese.ai 发音评分 · 逐音节声调纠错</p>
        </div>
      </div>
      <nav class="tabs" aria-label="页面切换">
        <button id="tabHome" class="tab on" type="button">首页</button>
        <button id="tabDict" class="tab" type="button">查字典</button>
        <button id="tabHistory" class="tab" type="button">历史记录</button>
      </nav>
    </header>

    <main class="layout" id="homeView">
      <aside class="panel lessons">
        <div class="panel-head">
          <h2>课文</h2>
          <span class="count" id="lessonCount"></span>
        </div>
        <label class="collection-picker">
          <span>当前合集</span>
          <select id="collection" aria-label="切换打卡合集"></select>
        </label>
        <div class="search-row">
          <input id="search" class="search" type="search" placeholder="搜句子 / 课名，例：问路、几多钱" />
          <div class="date-filter" title="按日期筛选课文">
            <span>日期</span>
            <input id="dateSearch" type="text" inputmode="numeric" placeholder="全部日期" aria-label="按日期筛选课文" readonly />
            <button id="dateClear" class="date-clear" type="button" aria-label="清除日期筛选" hidden>×</button>
          </div>
        </div>
        <div class="list-filter-bar">
          <div class="chips" id="filterChips">
            <button class="chip on" data-filter="all" type="button">全部</button>
            <button class="chip" data-filter="todo" type="button">未打卡</button>
            <button class="chip" data-filter="done" type="button">已打卡</button>
            <button class="chip" data-filter="failed" type="button">未通过</button>
          </div>
          <div class="list-controls">
            <button id="sortOrder" class="ghost tiny-btn" type="button" aria-label="切换日期排序">正序 ↑</button>
          </div>
        </div>
        <div class="recent-card" id="recentCard" hidden>
          <button class="recent-head" id="recentToggle" type="button" aria-expanded="true" aria-controls="recentList">
            <span class="recent-dot" aria-hidden="true"></span>
            <span class="recent-title">最近打卡</span>
            <span class="recent-count" id="recentCount">0</span>
            <span class="recent-range">过去 12 小时</span>
            <span class="recent-caret" aria-hidden="true">▾</span>
          </button>
          <ul class="recent-list" id="recentList"></ul>
          <p class="recent-foot" id="recentFoot" hidden></p>
        </div>
        <div class="today-card" id="todayCard" title="完成整篇课文（所有句子都评分）且最后评分在今天，才算一篇今日打卡">
          <span class="today-emoji" id="todayEmoji" aria-hidden="true">🐣</span>
          <div class="today-info">
            <div class="today-title" id="todayTitle">今日打卡 <b>0</b> 篇</div>
            <div class="today-msg" id="todayMsg"></div>
          </div>
          <span class="today-streak" id="todayStreak" hidden></span>
        </div>
        <ul id="dayList" class="day-list"></ul>
      </aside>

      <div
        id="layoutResizer"
        class="layout-resizer"
        role="separator"
        aria-label="调整课文列表宽度"
        aria-orientation="vertical"
        aria-valuemin="240"
        aria-valuemax="520"
        tabindex="0"
      ></div>

      <section class="panel workbench">
        <div class="target" id="lessonHeader">
          <div class="target-head">
            <div class="lesson-info">
              <span class="tag" id="lessonTag">未选课文</span>
              <span class="target-raw" id="lessonProgress"></span>
            </div>
            <div class="lesson-actions">
              <button id="nextTodoBtn" class="ghost tiny-btn" type="button" title="跳到下一个还没打卡的日子">下一个未打卡 ↓</button>
            </div>
          </div>
          <span id="lessonTitle" hidden></span>
        </div>

        <div class="card lesson-demo">
          <div class="demo-label">
            <h3>示范</h3>
          </div>
          <div class="demo-tracks">
            <label class="demo-track" id="originalTrack">
              <span>原速</span>
              <audio id="demoAudio" controls preload="none"></audio>
            </label>
            <label class="demo-track" id="slowTrack" hidden>
              <span>慢速</span>
              <audio id="slowAudio" controls preload="none"></audio>
            </label>
          </div>
          <label class="field inline">
            <span>倍速</span>
            <select id="rate">
              <option value="0.25">0.25×</option>
              <option value="0.6">0.6×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
            </select>
          </label>
        </div>

        <div class="practice-head">
          <div>
            <h2>课文</h2>
            <p class="muted tiny">点字听音 · 点句首 ▶ 逐字示范 · 移到句子上录音</p>
          </div>
          <span class="count" id="sentenceCount"></span>
        </div>

        <div id="sentenceCards" class="lesson-article"></div>
        <div class="batch-actions">
          <button id="scoreAllBtn" class="primary big" type="button" disabled>评分已录音内容</button>
          <span class="muted tiny" id="batchStatus"></span>
        </div>
        <div id="lessonSummary" class="result lesson-summary" hidden></div>
        <p class="muted tiny page-status" id="pageStatus"></p>
      </section>
    </main>

    <section class="history-view" id="historyView" hidden>
      <div class="panel history-card">
        <div class="panel-head">
          <h2>练习记录 <span class="muted tiny">点一条展开当时的纠音详情</span></h2>
          <span class="count" id="historyStats"></span>
        </div>
        <div class="list-filter-bar">
          <div class="chips" id="historyFilterChips">
            <button class="chip on" data-hfilter="all" type="button">全部</button>
            <button class="chip" data-hfilter="passed" type="button">已通过</button>
            <button class="chip" data-hfilter="failed" type="button">未通过</button>
          </div>
          <input id="historySearch" class="search history-search" type="search" placeholder="搜课名 / 句子，例：早餐、GAG" />
        </div>
        <ul id="history" class="history"></ul>
      </div>
    </section>

    <section class="dict-view" id="dictView" hidden>
      <div class="panel dict-card">
        <div class="panel-head">
          <h2>粤拼字典</h2>
          <span class="count" id="dictStats"></span>
        </div>
        <p class="muted tiny dict-intro">输入单字或句子，查每个字的粤语发音和粤拼（声母 / 韵母 / 声调），简体繁体都可以。点任意汉字听发音。</p>
        <div class="dict-search-row">
          <input id="dictSearch" class="search dict-search" type="search" maxlength="100" autocomplete="off" enterkeyhint="search"
            placeholder="输入单字或句子，例：食、早晨、几多钱" aria-label="查粤拼的单字或句子" />
          <button id="dictPlay" class="dict-play" type="button" data-say="" hidden title="按顺序播放这句话里每个字的发音">▶ 听整句</button>
        </div>
        <div class="dict-examples" id="dictExamples"></div>
        <div id="dictResult" class="dict-result" aria-live="polite"></div>
      </div>
    </section>

    <script src="./vendor/flatpickr/flatpickr.min.js"></script>
    <script src="./vendor/flatpickr/zh.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
